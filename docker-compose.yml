services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nortverse
      POSTGRES_USER: nortverse
      POSTGRES_PASSWORD: nortverse_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nortverse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
