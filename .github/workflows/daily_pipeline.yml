name: Pipeline & Sonuç Güncelleme

# Sprint 14.1 — Cron 7→3'e azaltıldı (Neon data transfer kota optimizasyonu)

on:
  schedule:
    - cron: "0 5 * * *"    # 08:00 İstanbul — sabah analiz (run-pipeline)
    - cron: "0 19 * * *"   # 22:00 İstanbul (update-scores)
    - cron: "30 21 * * *"  # 00:30 İstanbul — gece geç maçlar (update-scores)
  workflow_dispatch:
    inputs:
      command:
        description: 'Çalıştırılacak komut'
        required: false
        default: 'run-pipeline'
        type: choice
        options:
          - run-pipeline
          - update-scores
          - refresh-fixture-cache

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Playwright browser yükle
        run: |
          cd backend
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Veritabanı şemasını güncelle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          alembic upgrade head

      - name: Komut çalıştır
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          SCHEDULE="${{ github.event.schedule }}"
          CMD="${{ github.event.inputs.command }}"

          if [ "$SCHEDULE" = "0 5 * * *" ] || [ "$SCHEDULE" = "0 6 * * *" ] || [ "$CMD" = "run-pipeline" ] || ([ -z "$CMD" ] && [ -z "$SCHEDULE" ]); then
            echo "Pipeline çalışıyor (run-pipeline)... [schedule=$SCHEDULE]"
            python -m app.cli.main run-pipeline --incremental
          elif [ "$CMD" = "refresh-fixture-cache" ]; then
            echo "Yarınki bülten hazırlanıyor (refresh-fixture-cache)..."
            python -m app.cli.main refresh-fixture-cache
          else
            echo "Sonuç güncellemesi çalışıyor (update-scores)... [schedule=$SCHEDULE]"
            python -m app.cli.main update-scores
          fi

      - name: Yarınki bülteni ve analizleri hazırla
        if: ${{ always() && github.event.schedule == '0 19 * * *' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          PREPARE_DATE=$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Istanbul"))
          print((now.date() if now.hour < 8 else now.date() + timedelta(days=1)).isoformat())
          PY
          )
          python -m app.cli.main run-pipeline --date "$PREPARE_DATE" --incremental
